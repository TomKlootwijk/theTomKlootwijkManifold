[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tkctg"
version = "1.0.0"
description = "Reference model for the Tom Klootwijk chrono-topological-geometric substrate"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]
